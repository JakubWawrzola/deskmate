[workspace]
members = [".", "crates/core", "crates/service"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
authors = ["Jakub Wawrzola"]

[package]
name = "deskmate"
version.workspace = true
description = "Deskmate - your computers in Home Assistant, on Windows and Linux"
authors.workspace = true
license.workspace = true
repository = ""
edition.workspace = true

[lib]
name = "deskmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The part of Deskmate that does not depend on Tauri.
deskmate-core = { path = "crates/core" }
# The service's settings type, its fingerprint, the provisioning frame and its
# pipe helpers: the app sets the service up with the same code that reads it.
deskmate-service = { path = "crates/service" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
# single-instance: przekazuje aktywacje protokolu deskmate: (klik przycisku toastu) do dzialajacej apki
tauri-plugin-single-instance = "2"
# globalne skroty klawiszowe (dzialaja gdy apka w trayu)
tauri-plugin-global-shortcut = "2"
# Signed updates (src/updates). native-tls only: the default features bring in
# rustls and ring, which need a C toolchain and break the ARM64 build. No
# "zip" either: the NSIS installer is the update artifact as it is.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# net and io-util: the named pipe of the Stream Deck channel (streamdeck/).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
# native-tls uses Windows Schannel, so MQTT TLS works on x64/ARM64 without ring/clang
rumqttc = { version = "0.25", default-features = false, features = ["use-native-tls"] }
sysinfo = "0.40"
# arboard bez default (image-data ciagnie ciezki crate image); na Windows = clipboard-win (pure rust)
arboard = { version = "3", default-features = false }
# native-tls = schannel na Windows (zero zaleznosci C - ring/clang niepotrzebne na ARM64).
# "-no-default" leaves out the bundled Mozilla roots: src/http_client.rs uses the system ones.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
url = "2"
log = "0.4"
env_logger = "0.11"
# Link Files: transfer encoding and checksums (link_files.rs). The Link
# protocol and its crypto are in deskmate-core.
base64 = "0.22"
sha2 = "0.11"
futures-util = "0.3"
rand = "0.10"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "native-tls"] }
# Wipes pairing keys from memory when they go out of scope.
zeroize = "1"

# Unit tests exercise audited code paths. This feature keeps them from writing
# into the real security log of the machine they run on.
[dev-dependencies]
deskmate-core = { path = "crates/core", features = ["audit-log-off"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# The Linux desktop keeps its secrets in the user's keyring through the
# Secret Service (GNOME Keyring, KWallet), which this core feature builds in.
[target.'cfg(target_os = "linux")'.dependencies]
deskmate-core = { path = "crates/core", features = ["secret-service"] }
# The session's services over D-Bus (src/linux): logind, notifications, MPRIS,
# the tray host. Tauri's runtime (tao) and the keyring already link this
# crate and the system's libdbus on Linux, so it adds no new code.
dbus = "0.9"

# #[implement] (COM callback for the camera monitor) expands to windows_core paths.
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Media_Control",
  "Foundation",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  # game controller input for the idle time sensor (gamepad.rs)
  "Win32_UI_Input_XboxController",
  "Win32_System_SystemInformation",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  # the Windows user name in the Stream Deck channel's pipe name (streamdeck/)
  "Win32_System_WindowsProgramming",
  # custom sensors and program controls: process list, service state
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Services",
  # family protection: the scheduled task that starts Deskmate again (family.rs)
  "Win32_System_TaskScheduler",
  "Win32_System_Power",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  # camera in use: IMFSensorActivityMonitor (media_activity.rs)
  "Win32_Media_MediaFoundation",
  "Win32_Media_Speech",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_RemoteDesktop",
  "Win32_Security",
  # family protection: the account's SID (family.rs)
  "Win32_Security_Authorization",
  # Credential Manager cleanup on uninstall (uninstall.rs)
  "Win32_Security_Credentials",
  # the one-time provisioning pipe of the Deskmate service (service/)
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  # the hidden window for sleep, wake-up and sign-out (power_events.rs);
  # Gdi is where its window class is declared
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  # screen brightness (monitor/brightness_win.rs): DDC/CI through dxva2 on
  # the physical monitors of each display, WMI for the built-in panel
  "Win32_Devices_Display",
  "Win32_System_Wmi",
  # toasts from our own XML (buttons need it, see notify.rs)
  "UI_Notifications",
  "Data_Xml_Dom",
]

[lints]
workspace = true

# CI runs clippy with -D warnings (AGENTS.md section 8). These two are on top
# of the default set: leftovers that must not reach a release.
[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
