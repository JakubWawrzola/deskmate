[package]
name = "deskmate-service"
version.workspace = true
description = "Deskmate without a signed-in user: keeps the computer connected to Home Assistant from a Windows service or a Linux daemon"
authors.workspace = true
license.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
name = "deskmate_service"

[[bin]]
name = "deskmate-service"
path = "src/main.rs"

[features]
# For tests only; release builds never enable it. It adds the dry-run power
# executor and takes the real one out, so a build with this feature cannot
# turn a computer off. It also adds the `console` subcommand and the options
# that point a run at a temporary data folder, a key file and other pipe
# names (on Linux: other folders and another status file).
test-hooks = []

[dependencies]
# The Link protocol, the machine scope, the seat and the settings type.
deskmate-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One thread drives the connection, the timers and both pipes. `net` is the
# named pipes, `io-util` their line reads and writes.
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "io-util"] }
# native-tls is Windows Schannel, the same TLS stack the app uses: no ring,
# no C toolchain.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "native-tls"] }
futures-util = "0.3"
# The keys live in the credential vault of the account the service runs as.
keyring = { version = "3", features = ["windows-native"] }
# Wipes keys and the frames that carry them.
zeroize = "1"
# `std` for a boxed logger: the service writes its own log file.
log = { version = "0.4", features = ["std"] }
# Time since boot, for the power safety valve.
sysinfo = "0.33"
# The pairing code (pairing.rs) is base64url; the same crate deskmate-core
# decodes keys with.
base64 = "0.22"

[dev-dependencies]
# Paused time: the tests of the runner control every timer.
tokio = { version = "1", features = ["test-util"] }

# The daemon stops on SIGTERM and SIGINT, reloads on SIGHUP, and hears about
# sleep through SIGUSR1 and SIGUSR2 (packaging/linux).
[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "1", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
# Service Control Manager plumbing: the dispatcher, the control handler and
# the calls that register a service.
windows-service = "0.8"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  # descriptors of the pipes and the data folder, the elevation check
  "Win32_Security",
  "Win32_Security_Authorization",
  # the data folder and the delayed removal of the running executable
  "Win32_Storage_FileSystem",
  # the process behind the one-time provisioning pipe
  "Win32_System_Pipes",
  "Win32_System_Threading",
  # the list of privileges the service keeps
  "Win32_System_Services",
  # where Program Files and ProgramData are
  "Win32_UI_Shell",
  "Win32_System_Com",
]
