[package]
name = "deskmate-core"
version.workspace = true
description = "Deskmate code shared by the app and by programs that run without a window"
authors.workspace = true
license.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
# Stops security::audit from writing the security log. For the test build of a
# crate that depends on this one, listed under its [dev-dependencies]: unit
# tests must not write into the real log. Never enable it as a normal
# dependency feature, that would switch the audit log off in the program.
audit-log-off = []
# Linux only: lets `SecretStore::Keyring` reach the Secret Service (GNOME
# Keyring, KWallet) through the system's libdbus. The desktop app turns it on.
# A program that keeps its secrets in key files, such as the daemon, leaves it
# off and links no D-Bus. Windows always has Credential Manager and ignores it.
secret-service = ["dep:keyring"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
# Wipes a secret from memory once it has been moved to its new entry.
zeroize = "1"
log = "0.4"
# Link URL checks (link.rs) and the URL allowlist (sys_commands.rs).
url = "2"
# The stop signal and the wait between seat checks (seat.rs), the welcome
# timeout (link.rs).
tokio = { version = "1", features = ["macros", "sync", "time"] }

# Deskmate Link (link.rs): handshake and frame encryption. The crypto stack is
# pure Rust - no ring, no C toolchain, so ARM64 keeps building.
aes-gcm = "0.10"
# Second cipher for the optional cascade layer.
chacha20poly1305 = "0.10"
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
# Ephemeral X25519 per session (forward secrecy).
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
futures-util = "0.3"
# Only the WebSocket stream type and its messages; connecting and TLS belong
# to the program that uses this crate.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[dev-dependencies]
# The handshake tests run a stand-in hub over an in-memory stream.
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  # confirmation dialog (security.rs)
  "Win32_UI_WindowsAndMessaging",
  # CPU temperature helper (cpu_temperature.rs): pipe, PawnIOLib, task, UAC
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  # the descriptor of the seat object a service creates (seat.rs)
  "Win32_Security_Authorization",
  "Win32_System_LibraryLoader",
  "Win32_System_TaskScheduler",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  # battery and AC state (sensors.rs)
  "Win32_System_Power",
  # one connection per computer: session state for the seat (seat.rs)
  "Win32_System_RemoteDesktop",
  # hardware telemetry (hardware.rs): WMI temperatures, PDH GPU counters, DXGI
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_System_Performance",
  "Win32_Graphics_Dxgi",
]

# The user's keyring behind `SecretStore::Keyring` (secrets.rs). Windows:
# Credential Manager. Linux: the Secret Service, only with the
# `secret-service` feature; `crypto-rust` encrypts the secret on its way over
# D-Bus without OpenSSL.
[target.'cfg(windows)'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
optional = true
features = ["sync-secret-service", "crypto-rust"]
