# Secret scan for Deskmate (AGENTS.md section 5).
# Runs in the pre-commit hook (.githooks/pre-commit) and in CI (.github/workflows/ci.yml).
# The default gitleaks rules find keys and tokens. The rules below add what
# they cannot know about: private network addresses, which are not secrets by
# format but must not be published either.

title = "Deskmate"

[extend]
useDefault = true

[[rules]]
id = "tailscale-address"
description = "Tailscale address (CGNAT range 100.64.0.0/10)"
regex = '''\b100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
keywords = ["100."]

  [[rules.allowlists]]
  description = "The range itself and the fixed address used in unit tests"
  regexes = [
    '''100\.64\.0\.0''',
    '''100\.101\.102\.103''',
  ]

[[rules]]
id = "private-lan-address"
description = "LAN address outside the 192.168.0.x and 192.168.1.x ranges used for examples"
regex = '''\b192\.168\.(?:[2-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.[0-9]{1,3}\b'''
keywords = ["192.168."]

# Protocol test vectors. Every key in them was generated for the tests by
# scripts/generate_link_vectors.py and is used nowhere else.
[[allowlists]]
description = "Link protocol test vectors"
paths = [
  '''^src-tauri/tests/fixtures/''',
  '''^tv/app/src/test/resources/''',
]

# Nothing in these paths is written by hand.
[[allowlists]]
description = "Lockfiles and generated or binary files"
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)gradle/wrapper/''',
  '''\.(png|ico|bin|jar)$''',
]
