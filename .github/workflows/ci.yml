# The checks from AGENTS.md section 8, run on every push and pull request.
# Actions are pinned to a commit and tools to a version; Dependabot proposes
# the updates (.github/dependabot.yml).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so that a new compiler release cannot turn a green tree red.
  RUST_TOOLCHAIN: "1.95.0"
  RUFF_VERSION: "0.17.4"
  # What scripts/fake_link_hub.py needs on the Windows runner.
  FAKE_HUB_PACKAGES: "aiohttp==3.14.5 cryptography==50.0.1"
  GITLEAKS_VERSION: "8.30.1"
  # gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Only the commits this push or pull request adds. The rules are in
      # .gitleaks.toml, which gitleaks reads from the repository root.
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..HEAD"
          else
            range="origin/main..HEAD"
          fi
          echo "Scanning ${range}"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="${range}" .

  window:
    name: Window (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  streamdeck:
    name: Stream Deck plugin (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamdeck-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: streamdeck-plugin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # Bundles the plugin, then checks the built folder and starts the bundle
      # against a stand-in for the Stream Deck app (scripts/check-bundle.mjs).
      - run: npm run build

  integration:
    name: Integration (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run "ruff==${RUFF_VERSION}" check custom_components scripts tests
      - run: pipx run "ruff==${RUFF_VERSION}" format --check custom_components scripts tests
      - run: python3 -m compileall -q custom_components scripts tests

  integration-tests:
    name: Integration tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Home Assistant release pinned in requirements-test.txt decides
      # the Python version.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest

  app:
    name: App (Rust)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update \
            --component rustfmt --component clippy --target aarch64-pc-windows-msvc
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # Tauri reads this folder at compile time. What is in it does not matter
      # for these checks, so the window is not built here.
      - name: Stand in for the built window
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: The ARM64 target still compiles
        run: cargo check --workspace --target aarch64-pc-windows-msvc
      # Asked per target: the tree of a Linux target may hold the system's
      # OpenSSL, the tree of a Windows target may not.
      - name: No C toolchain in the dependency tree of the Windows targets
        run: |
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            tree=$(cargo tree --workspace --prefix none --target "$target")
            if echo "$tree" | grep -E '^(ring|openssl|openssl-sys|rustls) '; then
              echo "::error::ring, openssl and rustls break the Windows ARM64 build (AGENTS.md section 5.5); found for $target"
              exit 1
            fi
          done

  core-linux:
    name: Core on Linux (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libdbus is what the `secret-service` feature links. Without the
      # feature the crate needs no system package.
      - name: Install the system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update \
            --component clippy --target aarch64-unknown-linux-gnu
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # The crate as a program without a user builds it: secrets in key files.
      - run: cargo clippy -p deskmate-core --all-targets -- -D warnings
      - run: cargo test -p deskmate-core
      # The crate as a desktop app builds it: the user's keyring as well.
      - run: cargo clippy -p deskmate-core --all-targets --features secret-service -- -D warnings
      - run: cargo test -p deskmate-core --features secret-service
      - name: The ARM64 target still compiles
        run: cargo check -p deskmate-core --target aarch64-unknown-linux-gnu

  # The Windows service, for real: installed as LocalSystem on the runner,
  # set up through its admin pipe and driven by the fake hub. The build has
  # the test-hooks feature, so power commands are recorded and never run.
  service:
    name: Service (Rust, end to end)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update             --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: service
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install $FAKE_HUB_PACKAGES
      - run: cargo clippy -p deskmate-service --all-targets --features test-hooks -- -D warnings
      - run: cargo test -p deskmate-service --features test-hooks
      - run: cargo build -p deskmate-service --features test-hooks
      - name: Install the service, drive it with the fake hub, uninstall it
        run: python ../tests/service_e2e.py --service

  # The Linux daemon: linted and tested with and without test hooks, run in
  # the foreground against the fake hub, and its systemd units checked. The
  # end-to-end run uses the test-hooks build, so power commands are recorded
  # and never run. Nothing is installed or started as a service.
  daemon:
    name: Daemon on Linux (Rust, end to end)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # native-tls is the system's OpenSSL on Linux.
      - name: Install the system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libssl-dev pkg-config
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update \
            --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: daemon
      # The fake hub needs aiohttp and cryptography, in the versions the
      # integration tests pin.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r ../requirements-test.txt
      - run: cargo clippy -p deskmate-service --all-targets -- -D warnings
      - run: cargo clippy -p deskmate-service --all-targets --features test-hooks -- -D warnings
      - run: cargo test -p deskmate-service
      - run: cargo test -p deskmate-service --features test-hooks
      - run: cargo build -p deskmate-service --features test-hooks
      - name: Pair the daemon, drive it with the fake hub, stop it
        run: python ../tests/daemon_e2e.py --binary target/debug/deskmate-service --hub-python python
      - run: cargo build --release -p deskmate-service
      # verify looks for the program at the path in ExecStart. The runner is
      # thrown away after the job; the units are never enabled.
      - name: Check the systemd units
        run: |
          sudo install -m 0755 target/release/deskmate-service /usr/bin/deskmate-service
          systemd-analyze verify --man=no ../packaging/linux/deskmate.service ../packaging/linux/deskmate-sleep.service
          systemd-analyze security --offline=yes --threshold=15 ../packaging/linux/deskmate.service

  # The packages for both architectures, each built natively. Ubuntu 22.04
  # sets the oldest glibc the program runs with (2.35).
  daemon-package:
    name: Daemon package (${{ matrix.arch }})
    needs: daemon
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libssl-dev pkg-config
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: daemon-package
      - run: cargo build --release -p deskmate-service
      - name: Pack the .deb and the tarball
        env:
          ARCH: ${{ matrix.arch }}
        run: sh ../packaging/linux/build.sh "$ARCH" target/release/deskmate-service ../dist-linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deskmate-daemon-${{ matrix.arch }}
          path: dist-linux/
          if-no-files-found: error

  # The desktop app on Linux (preview): linted and tested, then packed by
  # Tauri's bundler into a .deb and an AppImage, on Ubuntu 22.04 for its
  # glibc, natively for both architectures. tauri.linux.conf.json sets the
  # bundles and leaves the Windows resources out.
  desktop-linux:
    name: Desktop app on Linux (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # WebKitGTK and GTK for the window, AppIndicator for the tray, libdbus
      # for the session's services and the keyring, OpenSSL for native-tls;
      # patchelf and file for the AppImage.
      - name: Install the system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev \
            pkg-config build-essential file patchelf xdg-utils
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update \
            --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: desktop-linux
      - run: npm ci
      - run: npm run build
      - run: cargo clippy -p deskmate --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test -p deskmate
        working-directory: src-tauri
      - name: Build the .deb and the AppImage
        run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deskmate-desktop-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
