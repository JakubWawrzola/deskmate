# HACS default-repository requirements: the HACS action and hassfest must pass
# on the integration in custom_components/deskmate_link.
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The two validators follow their upstream branch on purpose: the point of
# this workflow, and of its weekly run, is to learn about new requirements as
# soon as HACS and Home Assistant add them. Everything else is pinned.
jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master
