<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Toggle Entity</title>
    <!-- Elgato's property inspector components, as in the official plugin template -->
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <link rel="stylesheet" href="inspector.css" />
  </head>
  <body>
    <!-- Key settings -->
    <sdpi-item label="Entity ID">
      <sdpi-textfield id="picker-target" setting="entityId" placeholder="light.desk"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item id="picker-item" label="Pick" hidden>
      <sdpi-select
        id="picker"
        datasource="getEntities"
        placeholder="Choose from Home Assistant"
        loading="Loading entities..."
        hot-reload
        show-refresh
      ></sdpi-select>
    </sdpi-item>

    <!-- Plugin settings, shared by every key -->
    <sdpi-item label="Connection">
      <sdpi-select global setting="connection" default="auto">
        <option value="auto">Automatic</option>
        <option value="deskmate">Deskmate app</option>
        <option value="direct">Direct</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Status">
      <p id="status-text" class="status" role="status"></p>
      <p id="status-hint" class="status hint" hidden></p>
    </sdpi-item>
    <div id="direct-settings">
      <sdpi-item label="HA URL">
        <sdpi-textfield global setting="haUrl" placeholder="http://homeassistant.local:8123"></sdpi-textfield>
      </sdpi-item>
      <sdpi-item label="Access token">
        <sdpi-password global setting="haToken" placeholder="Long-lived access token"></sdpi-password>
      </sdpi-item>
    </div>

    <script src="inspector.js"></script>
  </body>
</html>
