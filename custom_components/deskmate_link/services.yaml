notify:
  fields:
    node_id:
      required: false
      example: my_laptop
      selector:
        text:
    title:
      required: true
      example: Laundry done
      selector:
        text:
    message:
      required: true
      example: Take it out of the washer.
      selector:
        text:
    image:
      required: false
      selector:
        text:
    actions:
      required: false
      selector:
        object:
send_file:
  fields:
    node_id:
      required: false
      selector:
        text:
    path:
      required: true
      example: /media/snapshots/door.jpg
      selector:
        text:
    filename:
      required: false
      selector:
        text:
fetch_file:
  fields:
    node_id:
      required: false
      selector:
        text:
    path:
      required: true
      example: C:\Users\Me\Documents\report.pdf
      selector:
        text:
    destination:
      required: true
      example: /media/deskmate
      selector:
        text:
    overwrite:
      required: false
      default: false
      selector:
        boolean:
