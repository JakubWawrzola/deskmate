notify:
  fields:
    node_id:
      required: false
      example: my_laptop
      selector:
        text:
    title:
      required: true
      example: Laundry done
      selector:
        text:
    message:
      required: true
      example: Take it out of the washer.
      selector:
        text:
    image:
      required: false
      selector:
        text:
    image_placement:
      required: false
      example: hero
      selector:
        select:
          options:
            - logo
            - hero
            - inline
    actions:
      required: false
      selector:
        object:
    tag:
      required: false
      example: doorbell
      selector:
        text:
    priority:
      required: false
      example: high
      selector:
        select:
          options:
            - normal
            - high
            - urgent
clear_notification:
  fields:
    node_id:
      required: false
      example: my_laptop
      selector:
        text:
    tag:
      required: true
      example: doorbell
      selector:
        text:
send_file:
  fields:
    node_id:
      required: false
      selector:
        text:
    path:
      required: true
      example: /media/snapshots/door.jpg
      selector:
        text:
    filename:
      required: false
      selector:
        text:
fetch_file:
  fields:
    node_id:
      required: false
      selector:
        text:
    path:
      required: true
      example: C:\Users\Me\Documents\report.pdf
      selector:
        text:
    destination:
      required: true
      example: /media/deskmate
      selector:
        text:
    overwrite:
      required: false
      default: false
      selector:
        boolean:
tv_update:
  fields:
    node_id:
      required: false
      example: living_room_tv
      selector:
        text:
    file:
      required: false
      example: DeskmateTV-0.2.0.apk
      selector:
        text:
